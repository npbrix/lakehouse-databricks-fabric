# Source system: legacy_accounts (wealth domain). See core_banking.yml for the fields.
# Bronze tables: <env>_wealth.bronze_legacy_accounts.<name>

datasets:
  - name: accounts
    description: Accounts from the legacy account system (CSV with header).
    format: csv
    schema: >-
      account_id BIGINT, customer_id BIGINT, account_type STRING, opened_date DATE